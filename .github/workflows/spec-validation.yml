name: Specification & Database Verification CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-specs:
    name: Validate V2.3.2 Specification Harmonization
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Specification Verification Suite
        run: |
          python scripts/validate_spec.py

  database-tests:
    name: Run PostgreSQL 16 Concurrency & Ledger Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gadispot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Test Dependencies
        run: |
          pip install -r requirements-test.txt

      - name: Run Pytest Database Test Suite
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gadispot_test
        run: |
          pytest tests/ -v
